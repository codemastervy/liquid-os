name: Build Liquid OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "livebuild-overlay/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap ubuntu-keyring \
            squashfs-tools xorriso isolinux syslinux-efi syslinux-utils \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools python3-pip
          pip3 install --break-system-packages pillow

      - name: Generate liquid-glass wallpaper
        run: |
          mkdir -p livebuild-overlay/includes.chroot/usr/share/backgrounds/liquidos
          python3 scripts/generate-wallpaper.py \
            livebuild-overlay/includes.chroot/usr/share/backgrounds/liquidos/wallpaper.png

      - name: Configure live-build
        run: |
          mkdir -p build
          cd build
          lb config \
            --mode ubuntu \
            --distribution noble \
            --architectures amd64 \
            --archive-areas "main restricted universe multiverse" \
            --binary-images iso-hybrid \
            --bootloader syslinux \
            --syslinux-theme live-build \
            --debian-installer false \
            --iso-application "Liquid OS" \
            --iso-publisher "https://github.com/codemastervy/liquid-os" \
            --iso-volume "LIQUIDOS" \
            --memtest none

      - name: Merge Liquid OS overlay into live-build config
        run: |
          mkdir -p build/config/package-lists build/config/includes.chroot \
                   build/config/includes.binary build/config/hooks
          cp -av livebuild-overlay/package-lists/. build/config/package-lists/
          cp -av livebuild-overlay/includes.chroot/. build/config/includes.chroot/
          # includes.binary lands in the ISO root itself (alongside casper/ and
          # isolinux/), which is where /.disk/info has to go to brand the media.
          if [ -d livebuild-overlay/includes.binary ]; then
            cp -av livebuild-overlay/includes.binary/. build/config/includes.binary/
            echo "=== .disk/info that will ship in the ISO ==="
            cat build/config/includes.binary/.disk/info
          fi
          cp -av livebuild-overlay/hooks/. build/config/hooks/
          chmod +x build/config/hooks/*.chroot

      - name: Build ISO
        run: |
          set -euo pipefail
          cd build

          # lb build == lb bootstrap && lb chroot && lb binary && lb source
          # (confirmed from live-build's own scripts/build/lb_build). Split
          # so we can inject a correct isolinux boot config between chroot
          # and binary, once the actual installed kernel filename is known
          # (it can't be predicted ahead of time, and live-build's own
          # bundled isolinux template assumes Debian's live-boot layout,
          # not casper's -- see commit history for the long version).
          # lb source is skipped: unneeded for the binary ISO we care about.
          sudo lb bootstrap 2>&1 | tee build.log
          sudo lb chroot 2>&1 | tee -a build.log

          KVER=$(basename "$(ls chroot/boot/vmlinuz-* | head -n1)" | sed 's/^vmlinuz-//')
          echo "Detected installed kernel version: $KVER"
          mkdir -p config/bootloaders/isolinux
          ln -sf /usr/lib/syslinux/isolinux.bin config/bootloaders/isolinux/isolinux.bin
          ln -sf /usr/lib/syslinux/modules/bios/ldlinux.c32 config/bootloaders/isolinux/ldlinux.c32
          cat > config/bootloaders/isolinux/isolinux.cfg <<EOF
          DEFAULT live
          TIMEOUT 50
          PROMPT 0
          LABEL live
            KERNEL /casper/vmlinuz-$KVER
            APPEND initrd=/casper/initrd.img-$KVER boot=casper quiet splash ---
          EOF

          sudo lb binary 2>&1 | tee -a build.log

          if ! ls *.iso >/dev/null 2>&1; then
            echo "::error::lb build produced no .iso file. Check the build-log artifact for the real failure (lb build itself often exits 0 even when an internal stage failed)."
            exit 1
          fi

      - name: Rename artifact
        run: |
          cd build
          iso=$(ls *.iso | head -n1)
          mv "$iso" "Liquid-OS-$(date +%Y%m%d)-amd64.iso"
          ls -lh *.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-os-iso
          path: build/Liquid-OS-*.iso
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build
          iso=$(ls Liquid-OS-*.iso | head -n1)
          size=$(stat -c%s "$iso")
          limit=$((2 * 1024 * 1024 * 1024))
          sha=$(sha256sum "$iso" | cut -d' ' -f1)

          {
            echo "Liquid OS - Ubuntu 24.04 LTS with the Liquid Glass GNOME desktop."
            echo ""
            echo "Boots to a live GNOME session and can be installed to disk with"
            echo "the \"Install Liquid OS\" icon (ubiquity)."
            echo ""
            echo "File: $iso ($size bytes)"
            echo "SHA256: $sha"
            echo ""
            echo "BIOS/legacy boot (isolinux) only for now; no UEFI boot yet."
            echo "Most VMs and legacy-mode hardware are fine."
            echo ""
            echo "GitHub caps release assets at 2GB. If this ISO is published as"
            echo "split parts, reassemble it with:"
            echo ""
            echo '    cat Liquid-OS-*.iso.part-* > Liquid-OS.iso'
            echo '    sha256sum -c Liquid-OS-*.iso.sha256'
          } > release-notes.md

          # Idempotent: a tag can legitimately be re-pushed (a history rewrite
          # moves every tag), which re-runs this job against a tag whose
          # release already exists. `gh release create` fails outright in that
          # case and, under `set -e`, failed the whole build -- so edit the
          # existing release instead of dying on it.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists -- updating it."
            gh release edit "${{ github.ref_name }}" \
              --title "Liquid OS ${{ github.ref_name }}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "${{ github.ref_name }}" \
              --title "Liquid OS ${{ github.ref_name }}" \
              --notes-file release-notes.md \
              --latest
          fi

          if [ "$size" -lt "$limit" ]; then
            gh release upload "${{ github.ref_name }}" "$iso" --clobber
          else
            echo "$iso is ${size} bytes, over GitHub's 2GB per-asset release limit -- splitting."
            split -b 1900M -d "$iso" "${iso}.part-"
            echo "$sha  $iso" > "${iso}.sha256"
            ls -lh "${iso}".part-* "${iso}.sha256"
            gh release upload "${{ github.ref_name }}" "${iso}".part-* "${iso}.sha256" --clobber
          fi
