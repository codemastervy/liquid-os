export USERNAME="liquid"
export USERFULLNAME="Liquid"
export HOST="liquidos"
# NOTE: the variable is BUILD_SYSTEM (with an underscore), not BUILDSYSTEM.
# casper-helpers does:
#   if [ "${BUILD_SYSTEM}" = "Debian" ] || [ "${BUILD_SYSTEM}" = "Ubuntu" ]; then
#       MP_QUIET="-q"
#   else
#       MP_QUIET=""
#   fi
# and casper then calls  modprobe "${MP_QUIET}" -b overlay
# With MP_QUIET empty that becomes modprobe "" -b overlay -- a quoted EMPTY
# first argument -- which fails, so casper panics with
# "'cow format specified as 'overlay' and no support found" and the live
# session drops to a BusyBox rescue shell. Spelling it correctly is the
# actual fix for that boot failure.
export BUILD_SYSTEM="Ubuntu"
